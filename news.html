<script>
(function(){
  var sel=[], list=document.getElementById('list'), bar=document.getElementById('filter');
  var used=window.TAGS.filter(function(t){return window.NEWS.some(function(n){return n.tg.indexOf(t)>=0;});});

  function chip(label,on,fn){
    var b=document.createElement('button');
    b.type='button'; b.textContent=label; b.setAttribute('aria-pressed',on?'true':'false');
    b.addEventListener('click',fn); return b;
  }
  function draw(){
    bar.textContent='';
    bar.appendChild(chip('すべて',sel.length===0,function(){sel=[];draw();}));
    used.forEach(function(t){
      bar.appendChild(chip(t,sel.indexOf(t)>=0,function(){
        var i=sel.indexOf(t); if(i<0){sel.push(t);}else{sel.splice(i,1);} draw();
      }));
    });
    var items=window.NEWS.filter(function(n){
      return sel.length===0 || n.tg.some(function(t){return sel.indexOf(t)>=0;});
    });
    var c=document.createElement('span'); c.className='count'; c.textContent=items.length+' 件';
    bar.appendChild(c);

    list.textContent='';
    if(!items.length){
      var e=document.createElement('p'); e.className='empty'; e.textContent='この条件の記事はまだありません。';
      list.appendChild(e); return;
    }
    var year=null, ul=null;
    items.forEach(function(n){
      var y=n.d.slice(0,4);
      if(y!==year){
        year=y;
        var h=document.createElement('div'); h.className='yr';
        var b=document.createElement('b'); b.textContent=y+' 年'; h.appendChild(b);
        h.appendChild(document.createElement('i'));
        list.appendChild(h);
        ul=document.createElement('ul'); ul.className='items'; list.appendChild(ul);
      }
      var li=document.createElement('li'); li.className='it';
      var dt=document.createElement('div'); dt.className='dt'; dt.textContent=n.d.slice(5).replace('-','/');
      var rail=document.createElement('div'); rail.className='rail';
      var bd=document.createElement('div'); bd.className='bd';
      var h3=document.createElement('h3'); h3.textContent=n.t; bd.appendChild(h3);
      (n.s||[]).forEach(function(line){
        var p=document.createElement('p'); p.textContent=line; bd.appendChild(p);
      });
      if(n.tg && n.tg.length){
        var tg=document.createElement('ul'); tg.className='tg';
        n.tg.forEach(function(t){var x=document.createElement('li');x.textContent=t;tg.appendChild(x);});
        bd.appendChild(tg);
      }
      var ft=document.createElement('p'); ft.className='ft';
      ft.appendChild(document.createTextNode('出典：'));
      (n.src||[]).forEach(function(s,i){
        if(i){ft.appendChild(document.createTextNode('・'));}
        var a=document.createElement('a'); a.href=s.u; a.target='_blank'; a.rel='noopener'; a.textContent=s.n;
        ft.appendChild(a);
      });
      if(n.rel){
        ft.appendChild(document.createTextNode('　'));
        var r=document.createElement('span'); r.className='rel'; r.textContent='→ '+n.rel; ft.appendChild(r);
      }
      bd.appendChild(ft);
      li.appendChild(dt); li.appendChild(rail); li.appendChild(bd); ul.appendChild(li);
    });
  }
  draw();
})();
</script>
