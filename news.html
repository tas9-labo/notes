<style>
/* このページだけの見た目：絞り込みの札と、縦型の年表 */
.filter{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:30px}
.filter button{font:inherit;font-size:13px;line-height:1.4;padding:6px 14px;border-radius:980px;cursor:pointer;
  background:var(--card);color:var(--sub);border:1px solid var(--line)}
.filter button:hover{color:var(--ink)}
.filter button[aria-pressed="true"]{background:var(--accent);color:var(--on-color);border-color:transparent;font-weight:500}
.filter .count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--sub)}
.yr{display:flex;align-items:center;gap:12px;margin:34px 0 4px}
.yr b{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.1em;color:var(--sub)}
.yr i{flex:1;height:1px;background:var(--line)}
.items{list-style:none;margin:0;padding:0}
.it{display:grid;grid-template-columns:92px 18px minmax(0,1fr);gap:0;padding:16px 0 18px}
.it .dt{font-family:var(--mono);font-size:12px;color:var(--sub);padding-top:4px;letter-spacing:.02em}
.it .rail{position:relative}
.it .rail::before{content:"";position:absolute;left:50%;top:0;bottom:-18px;width:1px;background:var(--line)}
.it:last-child .rail::before{bottom:auto;height:16px}
.it .rail::after{content:"";position:absolute;left:50%;top:7px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--accent)}
.it .bd{min-width:0;padding-left:18px}
.it h3{margin:0;font-size:17px;font-weight:600;line-height:1.5;letter-spacing:-.005em}
.it p{margin-top:8px;font-size:14px;line-height:1.85}
.it .tg{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;padding:0;list-style:none}
.it .tg li{background:var(--tonal);border-radius:7px;padding:3px 9px;font-size:11px;color:var(--sub);line-height:1.5}
.it .ft{margin-top:10px;font-size:12px;color:var(--sub)}
.it .ft a{color:var(--sub);text-decoration:none;border-bottom:1px solid var(--line)}
.it .ft a:hover{color:var(--ink)}
.it .ft .rel{color:var(--accent)}
.empty{margin-top:30px;font-size:14px;color:var(--sub)}
@media (max-width:720px){
  .it{grid-template-columns:14px minmax(0,1fr);padding:14px 0 16px}
  .it .dt{grid-column:2;padding:0 0 0 16px}
  .it .rail{grid-row:1 / span 2}
  .it .bd{grid-column:2;padding-left:16px;margin-top:4px}
  .filter{margin-top:24px}

  <h2>業界の動き</h2>
  <p class="sub">一次資料（公式の発表・公表資料）を読んで、要点だけを書いています。数字をこのサイトの本文に入れる時は、あらためて原典で確かめます。</p>

  <div id="list"></div>
</section>

<script src="news.js"></script>
<script>
(function(){
  var sel=[], list=document.getElementById('list'), bar=document.getElementById('filter');
  var used=window.TAGS.filter(function(t){return window.NEWS.some(function(n){return n.tg.indexOf(t)>=0;});});

  function chip(label,on,fn){
    var b=document.createElement('button');
    b.type='button'; b.textContent=label; b.setAttribute('aria-pressed',on?'true':'false');
    b.addEventListener('click',fn); return b;
  }
  function draw(){
    bar.textContent='';
    bar.appendChild(chip('すべて',sel.length===0,function(){sel=[];draw();}));
    used.forEach(function(t){
      bar.appendChild(chip(t,sel.indexOf(t)>=0,function(){
        var i=sel.indexOf(t); if(i<0){sel.push(t);}else{sel.splice(i,1);} draw();
      }));
    });
    var items=window.NEWS.filter(function(n){
      return sel.length===0 || n.tg.some(function(t){return sel.indexOf(t)>=0;});
    });
    var c=document.createElement('span'); c.className='count'; c.textContent=items.length+' 件';
    bar.appendChild(c);

    list.textContent='';
    if(!items.length){
      var e=document.createElement('p'); e.className='empty'; e.textContent='この条件の記事はまだありません。';
      list.appendChild(e); return;
    }
    var year=null, ul=null;
    items.forEach(function(n){
      var y=n.d.slice(0,4);
      if(y!==year){
        year=y;
        var h=document.createElement('div'); h.className='yr';
        var b=document.createElement('b'); b.textContent=y+' 年'; h.appendChild(b);
        h.appendChild(document.createElement('i'));
        list.appendChild(h);
        ul=document.createElement('ul'); ul.className='items'; list.appendChild(ul);
      }
      var li=document.createElement('li'); li.className='it';
      var dt=document.createElement('div'); dt.className='dt'; dt.textContent=n.d.slice(5).replace('-','/');
      var rail=document.createElement('div'); rail.className='rail';
      var bd=document.createElement('div'); bd.className='bd';
      var h3=document.createElement('h3'); h3.textContent=n.t; bd.appendChild(h3);
      (n.s||[]).forEach(function(line){
        var p=document.createElement('p'); p.textContent=line; bd.appendChild(p);
      });
      if(n.tg && n.tg.length){
        var tg=document.createElement('ul'); tg.className='tg';
        n.tg.forEach(function(t){var x=document.createElement('li');x.textContent=t;tg.appendChild(x);});
        bd.appendChild(tg);
      }
      var ft=document.createElement('p'); ft.className='ft';
      ft.appendChild(document.createTextNode('出典：'));
      (n.src||[]).forEach(function(s,i){
        if(i){ft.appendChild(document.createTextNode('・'));}
        var a=document.createElement('a'); a.href=s.u; a.target='_blank'; a.rel='noopener'; a.textContent=s.n;
        ft.appendChild(a);
      });
      if(n.rel){
        ft.appendChild(document.createTextNode('　'));
        var r=document.createElement('span'); r.className='rel'; r.textContent='→ '+n.rel; ft.appendChild(r);
      }
      bd.appendChild(ft);
      li.appendChild(dt); li.appendChild(rail); li.appendChild(bd); ul.appendChild(li);
    });
  }
  draw();
})();
</script>
